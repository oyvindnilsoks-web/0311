<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tekst til tale</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #d6d3d1; --card: #fff; --accent: #1c1917; --accent-fg: #fff; --err: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --fg: #fafaf9; --muted: #a8a29e; --line: #44403c; --card: #292524; --accent: #fafaf9; --accent-fg: #1c1917; --err: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 20px; }
  label { display: block; font-size: .875rem; color: var(--muted); margin: 16px 0 4px; }
  textarea, select { width: 100%; padding: 10px; font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  textarea { min-height: 180px; resize: vertical; }
  .row { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  button { padding: 10px 18px; font: inherit; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  a.dl { color: var(--fg); }
  .count { margin-left: auto; font-size: .875rem; color: var(--muted); }
  #status { margin-top: 12px; min-height: 1.5em; color: var(--muted); word-break: break-word; }
  #status.err { color: var(--err); }
  audio { width: 100%; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>Tekst til tale</h1>
  <label for="text">Tekst</label>
  <textarea id="text" placeholder="Skriv eller lim inn tekst her …" autofocus></textarea>
  <label for="voice">Stemme</label>
  <select id="voice"><option value="">Standard (George)</option></select>
  <div class="row">
    <button id="go">Lag lyd</button>
    <a id="dl" class="dl" hidden download="tale.mp3">Last ned mp3</a>
    <span class="count" id="count">0 tegn</span>
  </div>
  <div id="status" role="status"></div>
  <audio id="player" controls hidden></audio>
</main>
<script>
const $ = (id) => document.getElementById(id);
const text = $("text"), voice = $("voice"), go = $("go"), status = $("status"), player = $("player"), dl = $("dl");

try { text.value = localStorage.getItem("tts-text") ?? ""; } catch {}
updateCount();
text.addEventListener("input", () => {
  updateCount();
  try { localStorage.setItem("tts-text", text.value); } catch {}
});

fetch("/api/voices").then((r) => r.ok ? r.json() : []).then((voices) => {
  for (const v of voices) voice.add(new Option(v.name, v.id));
}).catch(() => {});

go.addEventListener("click", async () => {
  if (!text.value.trim()) return setStatus("Skriv inn tekst først.", true);
  go.disabled = true;
  setStatus("Henter lyd fra ElevenLabs …");
  try {
    const r = await fetch("/api/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text.value, voice: voice.value }),
    });
    if (!r.ok) {
      const body = await r.json().catch(() => ({}));
      throw new Error(body.error || `Feil ${r.status}`);
    }
    const url = URL.createObjectURL(await r.blob());
    if (player.src) URL.revokeObjectURL(player.src);
    player.src = url; player.hidden = false; player.play().catch(() => {});
    dl.href = url; dl.hidden = false;
    setStatus("Ferdig.");
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    go.disabled = false;
  }
});

function updateCount() { $("count").textContent = `${text.value.length} tegn`; }
function setStatus(msg, isErr) { status.textContent = msg; status.className = isErr ? "err" : ""; }
</script>
</body>
</html>
